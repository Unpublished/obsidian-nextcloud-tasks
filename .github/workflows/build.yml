name: Build Obsidian plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify plugin files
        run: test -f main.js && test -f manifest.json && test -f styles.css

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-tasks
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
